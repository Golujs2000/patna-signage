<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- State Bank of India Logo -->
  <g transform="translate(14, 12)">
    <!-- SBI Blue Circle -->
    <circle cx="28" cy="28" r="26" fill="#0072bc"/>
    <!-- Center white keyhole circle -->
    <circle cx="28" cy="23" r="8" fill="#ffffff"/>
    <!-- Keyhole slit down to bottom edge -->
    <rect x="25.5" y="23" width="5" height="31" fill="#ffffff"/>
  </g>
  <!-- Brand Text -->
  <text x="78" y="37" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0072bc" letter-spacing="1.5">SBI</text>
  <text x="80" y="53" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#280071" letter-spacing="1">STATE BANK OF INDIA</text>
</svg>
