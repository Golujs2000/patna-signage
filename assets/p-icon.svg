<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Neon Golden Edge Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="9" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Red Face Gloss Gradient -->
    <linearGradient id="redFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF383F" />
      <stop offset="35%" stop-color="#E31B23" />
      <stop offset="70%" stop-color="#C41219" />
      <stop offset="100%" stop-color="#9E0B11" />
    </linearGradient>

    <!-- Top Highlight Sheen -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FF6B70" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E31B23" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neonRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FFDF40" />
      <stop offset="60%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Metal Side Return Gradient -->
    <linearGradient id="metalSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D4552" />
      <stop offset="40%" stop-color="#242B35" />
      <stop offset="100%" stop-color="#14181F" />
    </linearGradient>

    <!-- Front Left Face Return -->
    <linearGradient id="frontReturnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181D24" />
      <stop offset="100%" stop-color="#333B47" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="120" cy="235" rx="85" ry="12" fill="#000000" opacity="0.35" filter="url(#neonGlow)" />
  <ellipse cx="130" cy="232" rx="40" ry="7" fill="#FF8C00" opacity="0.4" filter="url(#neonGlow)" />

  <!-- 3D P SIDE EXTRUSIONS (Metal / Titanium depth) -->
  <!-- Top-left return facet -->
  <path d="M 68 32 L 88 18 L 88 28 L 68 44 Z" fill="url(#metalSideGrad)" />
  <!-- Main vertical spine facet (left side depth) -->
  <path d="M 68 44 L 88 28 L 88 148 L 68 152 Z" fill="#1A1E24" />
  <!-- Lower stem side return -->
  <path d="M 68 152 L 88 148 L 88 232 L 68 236 Z" fill="url(#metalSideGrad)" stroke="#111418" stroke-width="0.5" />
  <!-- Inner counter depth return -->
  <path d="M 88 95 L 126 112 L 126 138 L 88 150 Z" fill="#1C2129" />
  <!-- Right outer curve underside depth -->
  <path d="M 172 135 L 186 148 L 160 188 L 140 182 Z" fill="#151920" />

  <!-- GLOWING NEON ACRYLIC RIM (Yellow-Gold Illuminated Edge) -->
  <path d="M 86 24 
           L 155 60 
           C 192 80 205 110 185 148 
           C 170 178 140 186 105 174 
           L 105 234 
           L 70 234 
           L 70 94 
           C 70 94 130 94 140 94 
           C 152 94 160 102 152 120 
           C 145 135 130 140 105 138 
           L 105 148 
           C 135 150 165 145 176 122 
           C 188 98 175 74 148 68 
           L 86 24 Z" 
        fill="url(#neonRimGrad)" 
        filter="url(#neonGlow)" 
        opacity="0.9" />

  <!-- FRONT RED 3D FACE -->
  <!-- Upper loop and stem front face -->
  <path d="M 88 28
           L 152 62
           C 185 80 196 106 178 142
           C 165 170 136 178 104 168
           L 104 230
           L 72 230
           L 72 90
           L 88 28 Z"
        fill="url(#redFaceGrad)" />

  <!-- Inner Counter Cutout (Hole of the P) -->
  <path d="M 104 90
           L 136 90
           C 148 90 155 98 148 114
           C 142 128 128 134 104 132
           Z"
        fill="#1A1F26" />

  <!-- Front Face Red Gloss Overlay & Highlights -->
  <!-- Top slant arm highlight -->
  <path d="M 88 28 L 152 62 C 172 73 184 88 185 106 C 160 85 130 65 88 28 Z" fill="url(#topSheen)" />

  <!-- Inner Neon Contour Line -->
  <path d="M 90 32 L 148 64 C 176 80 184 102 170 134 C 158 158 134 164 108 156 L 108 226 L 76 226 L 76 92 Z" 
        fill="none" stroke="#FFE97A" stroke-width="2.2" opacity="0.9" />

  <!-- Inner Cutout Neon Glow Line -->
  <path d="M 104 90 L 136 90 C 148 90 155 98 148 114 C 142 128 128 134 104 132 Z" 
        fill="none" stroke="#FFAE00" stroke-width="2" opacity="0.95" />

  <!-- Sharp Specular Highlight on Outer Upper Crest -->
  <path d="M 130 52 C 145 60 162 72 172 88 C 170 78 158 66 142 58 Z" fill="#FFFFFF" opacity="0.8" />
</svg>
